services:
  seamit_postgres:
    image: postgres:16-alpine
    container_name: seamit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seamit_db}
      POSTGRES_USER: ${POSTGRES_USER:-seamit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seamit_secure_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - seamit_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/custom-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seamit} -d ${POSTGRES_DB:-seamit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    shm_size: 256mb

volumes:
  seamit_postgres_data:
    name: seamit_postgres_data
