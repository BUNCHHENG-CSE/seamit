# ==============================================================================
# SeamIT - Production PostgreSQL Configuration
# Optimized for SMB ITSM-ITAM Event Synchronization, JSONB & High-Throughput
# ==============================================================================

# --- Connectivity & Network ---
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# --- Memory Allocation (Tuned for Low-Latency JSON & Index Scans) ---
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 64MB

# --- Write-Ahead Log (WAL) & Checkpoints ---
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
min_wal_size = 100MB
max_wal_size = 2GB
synchronous_commit = off            # Microsecond commits for sync logs while WAL protects integrity

# --- Query Planner & SSD / NVMe Optimization ---
random_page_cost = 1.1             # Fast NVMe/SSD random access
effective_io_concurrency = 200     # Concurrent disk I/O operations
default_statistics_target = 100

# --- Worker Processes & Parallelism ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- Logging & Slow Query Diagnostics ---
logging_collector = on
log_min_duration_statement = 200   # Log queries exceeding 200ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# --- Autovacuum (Keeps Trigram & JSONB Indexes Compact) ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 500
