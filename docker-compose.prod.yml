services:
  seamit_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seamit_app_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://seamit:seamit_secure_password@seamit_postgres:5432/seamit_db
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: "300"
    ports:
      - "8000:8000"
    depends_on:
      seamit_postgres:
        condition: service_healthy

  seamit_postgres:
    image: postgres:16-alpine
    container_name: seamit_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: seamit_db
      POSTGRES_USER: seamit
      POSTGRES_PASSWORD: seamit_secure_password
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - seamit_prod_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/custom-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seamit -d seamit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    shm_size: 512mb

volumes:
  seamit_prod_postgres_data:
    name: seamit_prod_postgres_data
